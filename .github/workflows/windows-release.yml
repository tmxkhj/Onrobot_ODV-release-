name: Windows EXE Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'OnRobotViewer_v0.6.2_Source.zip'
      - '.github/workflows/windows-release.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Unpack source and install build tools
        shell: pwsh
        run: |
          Expand-Archive OnRobotViewer_v0.6.2_Source.zip source
          python -m pip install "pyinstaller>=6.11,<7" "Pillow>=11,<13"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows executable
        working-directory: source/OnRobotViewer_v0.6.2
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean OnRobotViewer.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item START_VIEWER.bat,START_DEMO.bat dist/OnRobotViewer/
          @'
          OnRobotViewer v0.6.2 - Windows x64
          Extract the entire ZIP, then run OnRobotViewer.exe.
          Keep the _internal folder alongside the EXE. Python is not required.
          Use START_DEMO.bat for simulated input, or Connect for HEX-H QC.
          Rated single-axis limits: Fx/Fy/Fz +/-200 N; Tx/Ty +/-20 Nm; Tz +/-13 Nm.
          Combined loads reduce allowable limits. RX Hz is PC reception rate.
          Execution and hardware tests are intentionally omitted for this release.
          '@ | Set-Content -Encoding utf8 dist/OnRobotViewer/READ_ME.txt
          Compress-Archive -Path dist/OnRobotViewer -DestinationPath ../../OnRobotViewer_v0.6.2_Windows_x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OnRobotViewer_v0.6.2_Windows_x64
          path: OnRobotViewer_v0.6.2_Windows_x64.zip
          if-no-files-found: error
          retention-days: 90
      - name: Publish download release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          Windows x64 portable EXE for HEX-H QC.
          Download OnRobotViewer_v0.6.2_Windows_x64.zip, extract the entire ZIP, and run OnRobotViewer.exe.
          Python installation is not required. Keep the _internal folder with the EXE.
          Changes: per-axis rated ranges and RX Hz, faster step plots, 2/5/10 second view, faster Demo transitions.
          Execution and hardware tests were omitted at the owner's request; test on the destination PC.
          '@
          $notes | Set-Content release-notes.txt
          gh release view v0.6.2 --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.6.2 OnRobotViewer_v0.6.2_Windows_x64.zip --clobber --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create v0.6.2 OnRobotViewer_v0.6.2_Windows_x64.zip --target "$env:GITHUB_SHA" --title "OnRobotViewer v0.6.2 - Windows EXE" --notes-file release-notes.txt --repo "$env:GITHUB_REPOSITORY"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
